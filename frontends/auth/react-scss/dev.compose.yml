# dev.compose.yml

name: frontend-template-dev

services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "${FRONTEND_HOST_PORT:-48101}:5173"
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
    environment:
      CI: "true"
      VITE_API_URL: /api
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Your project}
      VITE_API_TARGET: ${API_PROXY_TARGET:?Set API_PROXY_TARGET to the FastAPI backend}
    extra_hosts:
      - host.docker.internal:host-gateway
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev --host 0.0.0.0"

volumes:
  frontend_modules:
