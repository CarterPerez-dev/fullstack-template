[project]
name = "minimal-fastapi-template"
version = "1.0.0"
description = "Minimal production FastAPI template with async SQLAlchemy and JWT auth"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.162.0,<0.163.0",
    "starlette>=1.10.0,<1.11.0",
    "pydantic>=2.14.2,<2.15.0",
    "pydantic-settings>=2.16.2,<2.17.0",
    "email-validator>=2.3.0,<3.0.0",
    "psycopg2-binary>=2.9.13,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.55,<2.1.0",
    "alembic>=1.20.1,<1.21.0",
    "asyncpg>=0.32.0,<0.33.0",
    "python-multipart>=0.0.33,<0.1.0",
    "pyjwt>=2.15.1,<2.16.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "uuid6>=2025.0.1,<2026.0.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1,<0.29.0",
    "aiosqlite>=0.21.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app"]
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",     # line too long
    "B008",     # function call in default argument (FastAPI Depends)
    "UP046",
]
