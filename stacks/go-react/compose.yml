# compose.yml

name: go-api

include:
  - path: go-backend/compose.yml
    env_file: go-backend/.env

services:
  frontend:
    build:
      context: frontend
      target: production
    ports:
      - "${FRONTEND_HOST_PORT:-48080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
