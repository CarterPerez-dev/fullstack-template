# ©AngelaMos | 2026
# lint.yml

name: Template release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s template-tool -p 'test_*.py' -v
      - run: shellcheck install.sh uninstall.sh template-tool/template template-tool/install.sh
      - run: bash -n install.sh uninstall.sh template-tool/template template-tool/install.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        path:
          - backends/fastapi
          - stacks/fastapi-react/backend
          - stacks/portfolio/backend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: template_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: templates_test
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U template_test -d templates_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://template_test:disposable-ci-password@localhost:45432/templates_test
      TEST_POSTGRES_URL: postgresql+asyncpg://template_test:disposable-ci-password@localhost:45432/templates_test
      SECRET_KEY: disposable-ci-fixture-secret-not-for-deployment
      ENVIRONMENT: development
      PYTHONPATH: ${{ github.workspace }}/${{ matrix.path }}/app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check app
      - run: uv run --no-sync pylint app
      - run: uv run --no-sync mypy app
      - run: uv run --no-sync pytest
      - name: Transaction and HTTP response lifecycle
        run: uv run --no-sync pytest --confcutdir="$GITHUB_WORKSPACE/tests/release" "$GITHUB_WORKSPACE/tests/release/test_python_lifecycle.py" -v
      - name: PostgreSQL session security
        run: uv run --no-sync pytest --confcutdir="$GITHUB_WORKSPACE/tests/release" "$GITHUB_WORKSPACE/tests/release/test_python_security.py" -v
      - name: Portfolio database integrity
        if: matrix.path == 'stacks/portfolio/backend'
        run: uv run --no-sync pytest --confcutdir="$GITHUB_WORKSPACE/tests/release" "$GITHUB_WORKSPACE/tests/release/test_portfolio_integrity.py" -v
      - name: Portfolio media failure recovery
        if: matrix.path == 'stacks/portfolio/backend'
        run: uv run --no-sync pytest --confcutdir="$GITHUB_WORKSPACE/tests/release" "$GITHUB_WORKSPACE/tests/release/test_portfolio_media.py" -v
      - name: Migration chain
        run: uv run --no-sync alembic upgrade head
      - name: Audit locked production dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  python-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path:
          - stacks/fastapi-react/examples/minimal-production/backend
          - stacks/portfolio/examples/minimal-production/backend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    env:
      DATABASE_URL: postgresql+asyncpg://template_test:disposable-ci-password@localhost:45432/templates_test
      SECRET_KEY: disposable-ci-fixture-secret-not-for-deployment
      ENVIRONMENT: development
      PYTHONPATH: ${{ github.workspace }}/${{ matrix.path }}/app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check app
      - name: Transaction and lifespan regressions
        run: uv run --no-sync pytest --confcutdir="$GITHUB_WORKSPACE/tests/release" "$GITHUB_WORKSPACE/tests/release/test_python_lifecycle.py" -v

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        path:
          - backends/go-backend
          - stacks/go-react/go-backend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: template_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: templates_test
        ports:
          - 45432:5432
        options: >-
          --health-cmd "pg_isready -U template_test -d templates_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://template_test:disposable-ci-password@localhost:45432/templates_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.path }}/go.mod
          cache-dependency-path: ${{ matrix.path }}/go.sum
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        path:
          - frontends/auth/react-scss
          - frontends/open/react-scss
          - stacks/fastapi-react/frontend
          - stacks/go-react/frontend
          - stacks/portfolio/frontend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.34.9'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.path }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:scss
      - run: pnpm build
      - name: Browser refresh concurrency
        if: matrix.path != 'frontends/open/react-scss'
        run: node --experimental-vm-modules "$GITHUB_WORKSPACE/tests/release/test_client_refresh.mjs" "$GITHUB_WORKSPACE/${{ matrix.path }}"
      - run: pnpm audit --prod --audit-level high

  generated-runtime:
    needs: generator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [go, fastapi, open, frontend, native, fastapi-stack, go-stack, portfolio]
        environment: [development, production]
        exclude:
          - variant: native
            environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B tests/release/check_generated.py '${{ matrix.variant }}' '${{ matrix.environment }}'

  package-check:
    needs: [generator, python, python-examples, go, frontend, native, generated-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -B template-tool/release.py --version v0.1.0-check --output "$RUNNER_TEMP/template-assets"
      - run: python3 "$RUNNER_TEMP/template-assets/template.pyz" info

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontends/auth/react-native
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com/api
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.34.9'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontends/auth/react-native/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Native refresh concurrency
        run: node --experimental-vm-modules "$GITHUB_WORKSPACE/tests/release/test_client_refresh.mjs" "$GITHUB_WORKSPACE/frontends/auth/react-native"
      - name: Native credential storage ordering
        run: node --experimental-vm-modules "$GITHUB_WORKSPACE/tests/release/test_native_storage.mjs" "$GITHUB_WORKSPACE/frontends/auth/react-native"
      - run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/native-export"
      - run: pnpm audit --prod --audit-level high
